name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python }}, Herdr ${{ matrix.herdr }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
        herdr: ['0.9.5', '0.9.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The ring contract test runs the released Agent Letter Bridge against
      # this binary. The bridge needs Python 3.11+, the matrix includes 3.9,
      # so it gets its own interpreter, installed by hash, before the matrix
      # Python takes over `python3`.
      - name: Set up bridge interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Agent Letter Bridge (0.4.2, hash-verified)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/alb"
          echo 'agent-letter-bridge==0.4.2 --hash=sha256:b01271af0c63cea76abcae3fb894e6e50ac8a04c5466b4d671fb490237e1d59f' > "${RUNNER_TEMP}/alb-req.txt"
          "${RUNNER_TEMP}/alb/bin/python" -m pip install --require-hashes --only-binary=:all: -r "${RUNNER_TEMP}/alb-req.txt"
          echo "ALB_PYTHON=${RUNNER_TEMP}/alb/bin/python" >> "${GITHUB_ENV}"

      - name: Set up query interpreter
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned herdr (v${{ matrix.herdr }}, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              asset="herdr-linux-x86_64"
              case "${{ matrix.herdr }}" in
                0.9.5) want="14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d" ;;
                0.9.1) want="2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7" ;;
                *) exit 1 ;;
              esac
              ;;
            macOS)
              asset="herdr-macos-aarch64"
              case "${{ matrix.herdr }}" in
                0.9.5) want="fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2" ;;
                0.9.1) want="5fc7a7e7adfaca56fa80aa89dcb025693357268dab8285b9ce2d08a2313c89de" ;;
                *) exit 1 ;;
              esac
              ;;
            *)
              echo "unsupported runner os: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${{ matrix.herdr }}/${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${want}  ${RUNNER_TEMP}/herdr" | sha256sum -c -
          else
            echo "${want}  ${RUNNER_TEMP}/herdr" | shasum -a 256 -c -
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            xattr -d com.apple.quarantine "${RUNNER_TEMP}/herdr" 2>/dev/null || true
          fi
          mkdir -p "${RUNNER_TEMP}/herdr-bin"
          install -m 0755 "${RUNNER_TEMP}/herdr" "${RUNNER_TEMP}/herdr-bin/herdr"
          echo "${RUNNER_TEMP}/herdr-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/herdr-bin/herdr" --version

      - name: Run test suite
        shell: bash
        run: make ci 2>&1 | tee smoke.log

      - name: Native adapter tests must not skip
        run: |
          if grep -E 'test: SKIP' smoke.log; then
            echo "native adapter tests skipped in CI — not allowed" >&2
            exit 1
          fi
          grep -qF 'herdr bootstrap suite: PASS' smoke.log || {
            echo "native bootstrap suite did not prove it ran (no PASS line)" >&2
            exit 1
          }
          grep -qF 'ring verb suite: PASS' smoke.log || {
            echo "ring verb suite did not prove the bridge contract ran (no PASS line)" >&2
            exit 1
          }
          grep -qF 'herdr plugin suite: PASS' smoke.log || {
            echo "herdr plugin suite did not prove it ran (no PASS line)" >&2
            exit 1
          }
